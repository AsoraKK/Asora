name: Temporary Azure Read Role Assignments

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-temporary-read-roles
  cancel-in-progress: false

jobs:
  assign-and-verify:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: asora-psql-flex
      COSMOS_ACCOUNT: asora-cosmos-dev
      COSMOS_DATABASE: asora
      COSMOS_DATA_SCOPE: /dbs/asora
      DSR_STORAGE_ACCOUNT: stasoradsrdev
      DSR_CONTAINER: dsr-exports
      MEDIA_STORAGE_ACCOUNT: asoramediadev
      MEDIA_CONTAINER: user-media
      KEY_VAULT: kv-asora-flex-dev
      POSTGRES_SECRET_NAME: postgres-connection-string
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify tenant, subscription, and target resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          account_json="$(az account show -o json)"
          test "$(jq -r '.tenantId' <<<"$account_json")" = "$AZURE_TENANT_ID"
          test "$(jq -r '.id' <<<"$account_json")" = "$AZURE_SUBSCRIPTION_ID"

          sp_json="$(az ad sp show --id "$AZURE_CLIENT_ID" -o json)"
          test "$(jq -r '.displayName' <<<"$sp_json")" = 'github-actions-asora-deployer'
          sp_object_id="$(jq -r '.id' <<<"$sp_json")"
          [[ "$sp_object_id" =~ ^[0-9a-fA-F-]{36}$ ]]

          rg_scope="$(az group show --name "$RESOURCE_GROUP" --query id -o tsv)"
          test -n "$rg_scope"

          cosmos_scope="$(az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$COSMOS_ACCOUNT" --query id -o tsv)"
          test -n "$cosmos_scope"

          storage_scopes='[]'
          for target in \
            "$DSR_STORAGE_ACCOUNT|$DSR_CONTAINER" \
            "$MEDIA_STORAGE_ACCOUNT|$MEDIA_CONTAINER"; do
            storage_account="${target%%|*}"
            container="${target#*|}"
            account_id="$(az storage account show --name "$storage_account" --query id -o tsv)"
            account_rg="$(az storage account show --name "$storage_account" --query resourceGroup -o tsv)"
            test -n "$account_id"
            test -n "$account_rg"
            container_scope="$account_id/blobServices/default/containers/$container"
            az resource show --ids "$container_scope" -o none
            storage_scopes="$(jq -c --arg account "$storage_account" --arg container "$container" --arg resourceGroup "$account_rg" --arg scope "$container_scope" '. + [{account:$account,container:$container,resourceGroup:$resourceGroup,scope:$scope}]' <<<"$storage_scopes")"
          done

          jq -n \
            --arg principalId "$sp_object_id" \
            --arg resourceGroup "$RESOURCE_GROUP" \
            --arg resourceGroupScope "$rg_scope" \
            --arg cosmosAccount "$COSMOS_ACCOUNT" \
            --arg cosmosDatabase "$COSMOS_DATABASE" \
            --arg cosmosScope "$COSMOS_DATA_SCOPE" \
            --argjson storage "$storage_scopes" \
            '{principalId:$principalId,resourceGroup:$resourceGroup,resourceGroupScope:$resourceGroupScope,cosmosAccount:$cosmosAccount,cosmosDatabase:$cosmosDatabase,cosmosScope:$cosmosScope,storage:$storage,tenantSubscriptionMatch:true,noResourceOrBillingMutation:true}' > evidence/target-context.json

          {
            echo "SP_OBJECT_ID=$sp_object_id"
            echo "RG_SCOPE=$rg_scope"
            echo "COSMOS_SCOPE=$cosmos_scope"
          } >> "$GITHUB_ENV"

      - name: Inspect existing assignments
        shell: bash
        run: |
          set -euo pipefail
          az role assignment list \
            --assignee-object-id "$SP_OBJECT_ID" \
            --all \
            --query '[].{id:id,role:roleDefinitionName,scope:scope,createdOn:createdOn}' \
            -o json > evidence/existing-management-assignments.json

          az cosmosdb sql role definition list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$COSMOS_ACCOUNT" \
            -o json > evidence/cosmos-role-definitions.json

          az cosmosdb sql role assignment list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$COSMOS_ACCOUNT" \
            -o json > evidence/existing-cosmos-assignments.json

      - name: Probe PostgreSQL secret access without reading its value
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if secret_id="$(az keyvault secret show --vault-name "$KEY_VAULT" --name "$POSTGRES_SECRET_NAME" --query id -o tsv 2>"$error_file")"; then
            jq -n --arg secretId "$secret_id" '{status:"accessible",secretId:$secretId,valueRead:false}' > evidence/postgres-secret-access.json
          else
            error_code="$(grep -Eo 'AuthorizationFailed|Forbidden|ResourceNotFound|BadParameter|AuthenticationFailed' "$error_file" | head -n 1 || true)"
            jq -n --arg errorCode "${error_code:-unknown}" '{status:"not-accessible",errorCode:$errorCode,valueRead:false}' > evidence/postgres-secret-access.json
          fi
          rm -f "$error_file"

      - name: Create only missing temporary assignments
        shell: bash
        run: |
          set -euo pipefail
          assignments='[]'
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          record_management() {
            local role="$1" scope="$2" result="$3" id="$4" created_on="$5" revoke="$6"
            if [[ -z "$created_on" && "$result" == 'created' ]]; then
              created_on="$observed_at"
            fi
            assignments="$(jq -c --arg id "$id" --arg principalId "$SP_OBJECT_ID" --arg role "$role" --arg scope "$scope" --arg result "$result" --arg createdOn "$created_on" --arg observedAt "$observed_at" --arg revoke "$revoke" '. + [{assignmentId:$id,principalObjectId:$principalId,role:$role,scope:$scope,creationTimestamp:(if $createdOn == "" then null else $createdOn end),observedAt:$observedAt,commandResult:$result,plannedRevocationCommand:$revoke}]' <<<"$assignments")"
          }

          exact_management_assignment() {
            local role="$1" scope="$2"
            jq -r --arg role "$role" --arg scope "$scope" '[.[] | select(.role == $role and .scope == $scope)] | first // empty | [.id,.createdOn] | @tsv' evidence/existing-management-assignments.json
          }

          read -r rg_assignment rg_created_on < <(exact_management_assignment 'Reader' "$RG_SCOPE")
          if [[ -n "${rg_assignment:-}" ]]; then
            record_management 'Reader' "$RG_SCOPE" 'already-existed' "$rg_assignment" "${rg_created_on:-}" "az role assignment delete --ids $rg_assignment"
          else
            result="$(az role assignment create --assignee-object-id "$SP_OBJECT_ID" --assignee-principal-type ServicePrincipal --role 'Reader' --scope "$RG_SCOPE" -o json)"
            id="$(jq -r '.id' <<<"$result")"
            record_management 'Reader' "$RG_SCOPE" 'created' "$id" "$(jq -r '.createdOn // empty' <<<"$result")" "az role assignment delete --ids $id"
          fi

          cosmos_role_id="$(jq -r '[.[] | select(.roleName == "Cosmos DB Built-in Data Reader")][0].id // empty' evidence/cosmos-role-definitions.json)"
          test -n "$cosmos_role_id"
          cosmos_scope="$COSMOS_DATA_SCOPE"
          cosmos_assignment="$(jq -r --arg principalId "$SP_OBJECT_ID" --arg roleId "$cosmos_role_id" --arg scope "$cosmos_scope" '[.[] | select(.principalId == $principalId and .roleDefinitionId == $roleId and .scope == $scope)] | first // empty | .id' evidence/existing-cosmos-assignments.json)"
          if [[ -n "$cosmos_assignment" ]]; then
            record_management 'Cosmos DB Built-in Data Reader' "$cosmos_scope" 'already-existed' "$cosmos_assignment" '' "az cosmosdb sql role assignment delete --resource-group $RESOURCE_GROUP --account-name $COSMOS_ACCOUNT --role-assignment-id $cosmos_assignment"
          else
            result="$(az cosmosdb sql role assignment create --resource-group "$RESOURCE_GROUP" --account-name "$COSMOS_ACCOUNT" --principal-id "$SP_OBJECT_ID" --role-definition-id "$cosmos_role_id" --scope "$COSMOS_DATA_SCOPE" -o json)"
            id="$(jq -r '.id' <<<"$result")"
            record_management 'Cosmos DB Built-in Data Reader' "$cosmos_scope" 'created' "$id" '' "az cosmosdb sql role assignment delete --resource-group $RESOURCE_GROUP --account-name $COSMOS_ACCOUNT --role-assignment-id $id"
          fi

          while IFS='|' read -r storage_account container; do
            [[ -n "$storage_account" && -n "$container" ]] || continue
            account_id="$(az storage account show --name "$storage_account" --query id -o tsv)"
            scope="$account_id/blobServices/default/containers/$container"
            read -r existing existing_created_on < <(jq -r --arg scope "$scope" '[.[] | select(.role == "Storage Blob Data Reader" and .scope == $scope)] | first // empty | [.id,.createdOn] | @tsv' evidence/existing-management-assignments.json)
            if [[ -n "${existing:-}" ]]; then
              record_management 'Storage Blob Data Reader' "$scope" 'already-existed' "$existing" "${existing_created_on:-}" "az role assignment delete --ids $existing"
            else
              result="$(az role assignment create --assignee-object-id "$SP_OBJECT_ID" --assignee-principal-type ServicePrincipal --role 'Storage Blob Data Reader' --scope "$scope" -o json)"
              id="$(jq -r '.id' <<<"$result")"
              record_management 'Storage Blob Data Reader' "$scope" 'created' "$id" "$(jq -r '.createdOn // empty' <<<"$result")" "az role assignment delete --ids $id"
            fi
          done <<EOF
          $DSR_STORAGE_ACCOUNT|$DSR_CONTAINER
          $MEDIA_STORAGE_ACCOUNT|$MEDIA_CONTAINER
          EOF

          jq -n --arg observedAt "$observed_at" --argjson assignments "$assignments" --arg note 'Temporary read roles only; no Azure resource or billing mutation requested.' '{observedAt:$observedAt,assignments:$assignments,note:$note}' > evidence/temporary-role-assignments.json

      - name: Wait for read-role propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if az cosmosdb sql database list --resource-group "$RESOURCE_GROUP" --account-name "$COSMOS_ACCOUNT" -o none && \
               az storage blob list --account-name "$DSR_STORAGE_ACCOUNT" --container-name "$DSR_CONTAINER" --auth-mode login -o none && \
               az storage blob list --account-name "$MEDIA_STORAGE_ACCOUNT" --container-name "$MEDIA_CONTAINER" --auth-mode login -o none; then
              exit 0
            fi
            sleep 30
          done
          echo 'Read-role propagation did not complete within the bounded retry window.' >&2
          exit 1

      - name: Run bounded Azure read tests
        shell: bash
        run: |
          set -euo pipefail
          az resource list --resource-group "$RESOURCE_GROUP" --query '[].{name:name,type:type,resourceGroup:resourceGroup,state:provisioningState}' -o json > evidence/resource-inventory.json
          az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$COSMOS_ACCOUNT" --query '{name:name,resourceGroup:resourceGroup,documentEndpoint:documentEndpoint,provisioningState:provisioningState}' -o json > evidence/cosmos-account-metadata.json
          az cosmosdb sql database list --resource-group "$RESOURCE_GROUP" --account-name "$COSMOS_ACCOUNT" -o json > evidence/cosmos-databases.json
          az cosmosdb sql container list --resource-group "$RESOURCE_GROUP" --account-name "$COSMOS_ACCOUNT" --database-name "$COSMOS_DATABASE" -o json > evidence/cosmos-containers.json

          npm ci --prefix functions --ignore-scripts
          COSMOS_ENDPOINT="$(az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$COSMOS_ACCOUNT" --query documentEndpoint -o tsv)" \
          COSMOS_DATABASE="$COSMOS_DATABASE" \
          NODE_PATH=functions/node_modules \
          node <<'NODE'
          const { DefaultAzureCredential } = require('@azure/identity');
          const { CosmosClient } = require('@azure/cosmos');
          const fs = require('node:fs');

          (async () => {
            const credential = new DefaultAzureCredential();
            const client = new CosmosClient({ endpoint: process.env.COSMOS_ENDPOINT, aadCredentials: credential });
            const database = client.database(process.env.COSMOS_DATABASE);
            const containers = (await database.containers.readAll().fetchAll()).resources;
            const probes = [];
            for (const container of containers.slice(0, 2)) {
              const result = await database.container(container.id).items
                .query({ query: 'SELECT TOP 1 c.id FROM c' }, { maxItemCount: 1 })
                .fetchAll();
              probes.push({ container: container.id, boundedQuerySucceeded: true, returnedItems: result.resources.length });
            }
            fs.writeFileSync('evidence/cosmos-bounded-query.json', JSON.stringify({ listedContainers: containers.length, probes }, null, 2));
          })().catch((error) => {
            fs.writeFileSync('evidence/cosmos-bounded-query.json', JSON.stringify({ boundedQuerySucceeded: false, errorName: error.name, errorCode: error.code ?? null }, null, 2));
            process.exitCode = 1;
          });
          NODE

          NODE_PATH=functions/node_modules node <<'NODE'
          const { DefaultAzureCredential } = require('@azure/identity');
          const { BlobServiceClient } = require('@azure/storage-blob');
          const fs = require('node:fs');

          async function probe(account, containerName) {
            const service = new BlobServiceClient(`https://${account}.blob.core.windows.net`, new DefaultAzureCredential());
            const container = service.getContainerClient(containerName);
            let listed = 0;
            let first = null;
            for await (const blob of container.listBlobsFlat()) {
              listed += 1;
              first ??= blob.name;
              if (listed >= 1) break;
            }
            if (!first) return { account, container: containerName, listedObjects: 0, boundedObjectRead: 'empty' };
            const response = await container.getBlobClient(first).download();
            let bytes = 0;
            for await (const chunk of response.readableStreamBody) bytes += chunk.length;
            return { account, container: containerName, listedObjects: listed, boundedObjectRead: 'passed', bytesRead: bytes };
          }

          Promise.all([
            probe(process.env.DSR_STORAGE_ACCOUNT, process.env.DSR_CONTAINER),
            probe(process.env.MEDIA_STORAGE_ACCOUNT, process.env.MEDIA_CONTAINER),
          ]).then((results) => fs.writeFileSync('evidence/blob-bounded-read.json', JSON.stringify(results, null, 2)))
            .catch((error) => {
              fs.writeFileSync('evidence/blob-bounded-read.json', JSON.stringify({ boundedObjectRead: 'failed', errorName: error.name, errorCode: error.code ?? null }, null, 2));
              process.exitCode = 1;
            });
          NODE

      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: azure-temporary-read-role-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
