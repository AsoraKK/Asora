name: Dependency lock refresh

on:
  push:
    branches:
      - fix/dependency-audit-2026-08-06
    paths:
      - package.json
      - functions/package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v5
        with:
          ref: fix/dependency-audit-2026-08-06

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts --workspaces=false

      - name: Validate generated lockfiles
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --workspaces=false --prefix functions
          node scripts/check-npm-audit.js
          node scripts/check-npm-audit.js functions

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "fix(deps): refresh patched lockfiles [lockfiles refreshed]"
          git push origin HEAD:fix/dependency-audit-2026-08-06
