name: native-workers-deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lythaus-production-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate provisioned production configuration
        env:
          CLOUDFLARE_PRODUCTION_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_ZONE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ZONE_ID }}
          CLOUDFLARE_SHARED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_SHARED_ACCOUNT_ID }}
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-workers:provisioned
      - name: Validate production account and zone scope
        env:
          CLOUDFLARE_PRODUCTION_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_ZONE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ZONE_ID }}
          CLOUDFLARE_SHARED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_SHARED_ACCOUNT_ID }}
          CLOUDFLARE_ENVIRONMENT: production
        run: npm run validate:native-scope:production
      - name: Validate all production acceptance gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run validate:production-gates:require-pass
      - name: Validate migrations and generated Worker types
        run: |
          npm run validate:planetscale-migrations
          npm run validate:planetscale-extensions
          npm run validate:native-azure-dependencies
          npx wrangler types --check apps/lythaus-public-api/src/worker-configuration.d.ts --config apps/lythaus-public-api/wrangler.jsonc --env development
          npx wrangler types --check apps/lythaus-admin-api/src/worker-configuration.d.ts --config apps/lythaus-admin-api/wrangler.jsonc --env development
          npx wrangler types --check apps/lythaus-jobs/src/worker-configuration.d.ts --config apps/lythaus-jobs/wrangler.jsonc --env development
      - name: Apply approved production migrations
        env:
          PLANETSCALE_ADMIN_DATABASE_URL: ${{ secrets.PLANETSCALE_ADMIN_DATABASE_URL }}
          PLANETSCALE_PRODUCTION_MIGRATIONS_APPROVED: ${{ secrets.PLANETSCALE_PRODUCTION_MIGRATIONS_APPROVED }}
          PSCALE_ROLE_IDENTIFIERS: ${{ secrets.PSCALE_ROLE_IDENTIFIERS }}
          PSCALE_BRANCH_NAME: main
        run: npm run apply:planetscale-production-migrations
      - name: Deploy public API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/lythaus-public-api/wrangler.jsonc
      - name: Deploy admin API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/lythaus-admin-api/wrangler.jsonc
      - name: Deploy jobs Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/lythaus-jobs/wrangler.jsonc
